<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skinstore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
h1{
    font-weight: 600;
    font-size: 90px;
     background-color: rgb(214, 88, 88);
     margin-top: 10px;
    width: fit-content;
    color: aliceblue;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}
h3{
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
font-size: 100;
background-color: azure;
}
html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    padding-top:70px;
}

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    min-height:70px;
    background:rgb(243,207,207);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    z-index:1000;
    flex-wrap:wrap;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#d63384;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:35px;
    flex-wrap:wrap;
    justify-content:center;
}

.nav-links a{
    text-decoration:none;
    color:#333;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:#d63384;
}

.nav-icons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.nav-icons a{
    color:#333;
    font-size:22px;
    transition:.3s;
}

.nav-icons a:hover{
    color:#d63384;
    transform:scale(1.2);
}


.body{
    background-image:url(images/banner1.jpg);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
    width:100%;
}

.container{
    display:flex;
    justify-content:space-between;
    align-items:flex-start; 
    width:100%;
    min-height:calc(100vh - 70px);
    padding:40px 8%;
    gap:40px;
}

.welcome{
    flex:1;
}

.img{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}
.img img{
    transform:translateY(-30px) scale(1.05);
}

img{
    border:5px solid plum;
    width:100%;
    width:450px;
    height: 550px;
    border-radius:30%;
    margin-top:0%;
    transform:scale(1.05);
    display:block;
    margin-top: 50px;
}

.welcome,.to,.store{
    opacity:0;
    margin: 10px;
    padding: 10px;
}

.welcome{
    animation:topRotate 1.2s ease-out forwards;
}

.to{
    animation:leftRotate 1.2s ease-out forwards;
    animation-delay:.5s;
}

.store{
    animation:rightRotate 1.2s ease-out forwards;
    animation-delay:1s;
}

@keyframes topRotate{
    0%{
        transform:translateY(-300px) rotate(-360deg) scale(0);
        opacity:0;
    }
    80%{
        transform:translateY(20px) rotate(20deg) scale(1.1);
    }
    100%{
        transform:translateY(0) rotate(0deg) scale(1);
        opacity:1;
    }
}

@keyframes leftRotate{
    0%{
        transform:translateX(-400px) rotate(-360deg) scale(0);
        opacity:0;
    }
    80%{
        transform:translateX(20px) rotate(20deg) scale(1.1);
    }
    100%{
        transform:translateX(0) rotate(0deg) scale(1);
        opacity:1;
    }
}

@keyframes rightRotate{
    0%{
        transform:translateX(400px) rotate(360deg) scale(0);
        opacity:0;
    }
    80%{
        transform:translateX(-20px) rotate(-20deg) scale(1.1);
    }
    100%{
        transform:translateX(0) rotate(0deg) scale(1);
        opacity:1;
    }
}

@keyframes bottomRotate{
    0%{
        transform:translateY(300px) rotate(360deg) scale(0);
        opacity:0;
    }
    80%{
        transform:translateY(-20px) rotate(-20deg) scale(1.1);
    }
    100%{
        transform:translateY(0) rotate(0deg) scale(1);
        opacity:1;
    }
}

.welcome1{
    font-size:clamp(2rem,8vw,6rem);
}

.to{
    font-size:clamp(1.5rem,6vw,4rem);
}

.store{
    font-size:clamp(2rem,8vw,6rem);
}

h3{
    font-size:clamp(1rem,4vw,2rem);
}

@media (max-width:992px){

.container{
    flex-direction:column;
    text-align:center;
    justify-content:center;
    padding:40px 5%;
}

.img img{
    max-width:380px;
     display: flex;
    align-items: center;
    justify-content: center;
}

}

@media (max-width:768px){

.navbar{
    justify-content:center;
    gap:15px;
}

.logo{
    width:100%;
    text-align:center;
    font-size:24px;
}

.nav-links{
    width:100%;
    justify-content:center;
    gap:18px;
}

.nav-links a{
    font-size:16px;
}

.nav-icons{
    width:100%;
    justify-content:center;
}

body{
    padding-top:150px;
}

.img img{
    max-width:300px;
     display: flex;
    align-items: center;
    justify-content: center;
}

}

@media (max-width:480px){

.navbar{
    flex-direction:column;
    padding:15px;
}

.logo{
    font-size:22px;
}

.nav-links{
    gap:12px;
}

.nav-links a{
    font-size:14px;
}

.nav-icons{
    gap:15px;
}

body{
    padding-top:190px;
}

.container{
    padding:20px;
    gap:20px;
}

.img img{
    max-width:220px;
    display: flex;
    align-items: center;
    justify-content: center;
}

}

    </style>
</head>
<body class="body">
<nav class="navbar">
    <div class="logo">
        🌸 Skin Store
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="bestseller.html">Bestseller</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-icons">
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="#"><i class="fa-solid fa-user"></i></a>
    </div>
</nav>
<div class="container">
<div class="welcome">
<h1 class="welcome1">WELCOME</h1>
<H1 class="to" >TO</H1>
<h1 class="store">SKIN-STORE</h1>

<h3 >YOUR SKIN YOUR GLOW</h3>
</div>
<div class="content">
   
</div>
<div class="img">
<img src="images/side.jpg">
</div>
</div>
</body>
</html>
