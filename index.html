<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin Store</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    padding-top:80px;
    background-image:url(images/banner1.jpg);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    min-height:100vh;
}



.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgb(243,207,207);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#d63384;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:35px;
}

.nav-links a{
    text-decoration:none;
    color:#333;
    font-size:18px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:#d63384;
}

.nav-icons{
    display:flex;
    gap:20px;
}

.nav-icons a{
    color:#333;
    font-size:22px;
    transition:.3s;
}

.nav-icons a:hover{
    color:#d63384;
    transform:scale(1.2);
}


.container{
    width:100%;
   
    display:flex;

    padding:40px 8%;

    justify-content: flex-start;
    gap: 150px;
    min-height: auto;
}




.img{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
}

.img img{
    width:450px;
    max-width:90%;
    height:600px;
    object-fit:cover;
    border:5px solid plum;
    border-radius:30%;
}



.content{
    flex:1;
}

.content h1{
    font-size:80px;
    font-weight:700;
    background:rgb(214,88,88);
    color:white;
    width:fit-content;
    padding:5px 20px;
    margin-bottom:15px;
}

.content h3{
    margin-top:20px;
    font-size:20px;
    background:white;
    padding:15px;
    line-height:1.6;
    border-radius:10px;
}



.welcome{
    animation:topRotate 1s forwards;
}

.to{
    animation:leftRotate 1.2s forwards;
}

.store{
    animation:rightRotate 1.4s forwards;
}

@keyframes topRotate{
    from{
        transform:translateY(-250px) rotate(-360deg);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes leftRotate{
    from{
        transform:translateX(-250px) rotate(-360deg);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

@keyframes rightRotate{
    from{
        transform:translateX(250px) rotate(360deg);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}



 @media(max-width:992px) {

    body {
        margin-top: 30px;
    }

    .container {
        flex-direction: column;
        justify-content: flex-start;   
        align-items: center;
        text-align: center;
        gap: 30px;                   
        min-height: auto;            
    }

    .content h1 {
        margin: auto;
        margin-bottom: 15px;
    }

    .content h3 {
        font-size: 22px;
    }

    .img img {
        width: 350px;
        height: auto;
    }
}


 @media(max-width:576px) {

    body {
        padding-top: 170px;
    }

    .navbar {
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .nav-icons {
        justify-content: center;
    }

    .container {
        gap: 20px;              
        min-height: auto;
        justify-content: flex-start;
    }

    .content h1 {
        font-size: 45px;
    }

    .content h3 {
        font-size: 18px;
    }

    .img img {
        width: 230px;
        height: auto;
    }
}




</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌸 Skin Store
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="Bestseller.html">Bestseller</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="sign_up.html">Sign Up</a></li>
    </ul>

    <div class="nav-icons">
        <a href="products.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="Bestseller.html"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="sign_up.html"><i class="fa-solid fa-user"></i></a>
    </div>

</nav>

<div class="container">

   
    <div class="img">
        <img src="images/side.jpg" alt="Skin Store">
    </div>

   
    <div class="content">

        <h1 class="welcome">WELCOME</h1>

        <h1 class="to">TO</h1>

        <h1 class="store">SKIN STORE</h1>

        <h3>
            Discover premium skincare products for healthy,
            glowing skin. Shop the best beauty essentials
            with trusted brands and make your skin shine
            naturally every day.
        </h3>

    </div>

</div>

</body>
</html>
